<title>Noah's Unit 2 Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
:root{
  --ground:#EDF0F6; --surface:#FFFFFF; --surface-2:#F5F6FB; --ink:#141B3C; --ink-2:#4A5378; --line:#D5DAE8;
  --accent:#2742B8; --accent-ink:#FFFFFF; --accent-soft:#E1E7FB;
  --gold:#94600F; --gold-soft:#FBF0D9;
  --good:#1A7352; --good-soft:#DDF3EA; --bad:#AD2E46; --bad-soft:#FBE3E8;
  --rev:#64399A; --rev-soft:#EEE5F8;
  --era-r:#94600F; --era-f:#A8324B; --era-s:#2742B8;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1330; --surface:#182048; --surface-2:#1F2856; --ink:#ECEFFA; --ink-2:#A9B2D6; --line:#313C74;
    --accent:#93A8FF; --accent-ink:#0E1330; --accent-soft:#26336E;
    --gold:#E5B657; --gold-soft:#3A3120;
    --good:#5FD3A6; --good-soft:#15392F; --bad:#FF93A6; --bad-soft:#43202B;
    --rev:#C6A6F2; --rev-soft:#2E2450;
    --era-r:#E5B657; --era-f:#FF93A6; --era-s:#93A8FF;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1330; --surface:#182048; --surface-2:#1F2856; --ink:#ECEFFA; --ink-2:#A9B2D6; --line:#313C74;
  --accent:#93A8FF; --accent-ink:#0E1330; --accent-soft:#26336E;
  --gold:#E5B657; --gold-soft:#3A3120;
  --good:#5FD3A6; --good-soft:#15392F; --bad:#FF93A6; --bad-soft:#43202B;
  --rev:#C6A6F2; --rev-soft:#2E2450;
  --era-r:#E5B657; --era-f:#FF93A6; --era-s:#93A8FF;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:600}
p{margin:0}
.sub{color:var(--ink-2);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 4px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.01em}
.brand span{color:var(--accent)}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:15px;color:var(--ink-2)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-weight:700;font-size:16px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 14px;font-size:15px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);font-weight:400;padding-inline:6px}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.cal{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.cal div{border:1px solid var(--line);border-radius:10px;text-align:center;padding:7px 0 6px;font-size:12px;color:var(--ink-2);background:var(--surface-2);line-height:1.25}
.cal b{display:block;font-family:var(--display);font-size:17px;color:var(--ink)}
.cal .done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.cal .done b{color:var(--good)}
.cal .missed{border-style:dashed}
.cal .rev{background:var(--rev-soft);border-color:transparent;color:var(--rev)}
.cal .rev b{color:var(--rev)}
.cal .test{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.cal .test b{color:var(--accent)}
.cal .today{outline:2.5px solid var(--accent);outline-offset:1px}
@media (max-width:520px){.cal{grid-template-columns:repeat(5,minmax(0,1fr))}}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.step .mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.step.done .mark{background:var(--good-soft);border-color:transparent;color:var(--good)}
.step.next{background:var(--accent-soft)}
.step.next .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.locked{color:var(--ink-2)}
.step strong{display:block}
.step span.d{font-size:14px;color:var(--ink-2)}

.era{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.era.R{color:var(--era-r)} .era.F{color:var(--era-f)} .era.S{color:var(--era-s)}

.bar{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar.R i{background:var(--era-r)} .bar.F i{background:var(--era-f)} .bar.S i{background:var(--era-s)}

.flash{min-height:300px;justify-content:center;text-align:center;align-items:center;cursor:pointer;border-width:2px}
.flash .term{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,42px);line-height:1.1}
.flash .def{font-size:19px;max-width:32em}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:16px;text-align:left;max-width:34em}
.note b{color:var(--accent)}
.note.ask{background:var(--gold-soft)}
.note.ask b{color:var(--gold)}

.quote{border-left:4px solid var(--accent);padding:4px 0 4px 14px;font-size:19px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:17px}
.opt:hover{border-color:var(--accent)}
.opt .k{font-family:var(--display);font-weight:700;color:var(--ink-2)}
.opt.good{background:var(--good-soft);border-color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--line)}
.opt.good.locked:hover{border-color:var(--good)} .opt.bad.locked:hover{border-color:var(--bad)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.fb{border-radius:12px;padding:12px 16px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb b.good{color:var(--good)} .fb b.bad{color:var(--bad)}
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px 14px}
.match .opt{grid-template-columns:minmax(0,1fr);font-size:16px}
@media (max-width:520px){.match{grid-template-columns:minmax(0,1fr)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface-2);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--ink-2)}
.erarow{display:grid;grid-template-columns:170px minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:16px}
.erarow em{font-style:normal;color:var(--ink-2);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.erarow{grid-template-columns:minmax(0,1fr) 48px}.erarow .bar{grid-column:1/-1;order:3}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:14px;font-weight:700;border-radius:999px;padding:4px 12px;background:var(--bad-soft);color:var(--bad)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-2)}
.pips i.on{background:var(--good);border-color:var(--good)}

details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
details p{margin-top:8px}
details .hook{color:var(--ink-2);font-size:16px}
.lockedgrp{color:var(--ink-2)}

.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chain span{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:16px}
.chain i{font-style:normal;color:var(--accent);font-weight:700}
.warn{background:var(--gold-soft);color:var(--gold);border-radius:12px;padding:10px 14px;font-size:15px}
ol.miss{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
ol.miss span{color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.opt,.btn{transition:border-color .12s,background-color .12s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Unit 2 <span>Trainer</span></div>
    <nav class="nav" aria-label="Sections">
      <button id="nav-home" data-act="go" data-to="home">Today</button>
      <button id="nav-cards" data-act="go" data-to="cards">Cards</button>
      <button id="nav-progress" data-act="go" data-to="progress">Progress</button>
    </nav>
  </header>
  <main id="app" class="wrap"></main>
</div>

<script>
(function(){
"use strict";

/* ---------- content ---------- */
const ERA = {R:"Renaissance", F:"Reformation", S:"Scientific Revolution"};
const DAY_TITLES = ["A changing world","Renaissance ideas","Art and the printing press","The Reformation begins","The Reformation spreads","The Scientific Revolution","The big picture","Review day 1","Review day 2","Test day"];

const TERMS = [
 {id:"renaissance",day:1,era:"R",kind:"idea",term:"Renaissance",
  def:"A period of “rebirth” in Europe marked by a renewed interest in art and learning.",
  short:"Rebirth of art and learning in Europe",
  hook:"Re-naissance = re-birth. Europe got curious again about art, learning, and ancient Greece and Rome."},
 {id:"constantinople",day:1,era:"R",kind:"place",term:"Constantinople",
  def:"A major city that served as the capital of the Byzantine Empire until it was captured by the Ottoman Empire.",
  short:"Byzantine capital captured by the Ottomans",
  hook:"Captured in 1453. Today the city is called Istanbul. Its fall is a classic turning point."},
 {id:"ottoman",day:1,era:"R",kind:"place",term:"Ottoman Empire",
  def:"A large and powerful empire that captured Constantinople and controlled trade routes between Europe and Asia.",
  short:"Empire that controlled Europe–Asia trade routes",
  hook:"Think toll booth: the Ottomans sat between Europe and Asia, so trade had to pass through them."},
 {id:"turning",day:1,era:"R",kind:"idea",term:"Turning point",
  def:"A major event that causes a significant change in the course of history.",
  short:"Event that changes the course of history",
  hook:"Like a plot twist in a movie: after it, the story heads in a new direction. Examples: the fall of Constantinople, the printing press."},

 {id:"humanism",day:2,era:"R",kind:"idea",term:"Humanism",
  def:"An intellectual movement during the Renaissance that focused on human potential and achievements.",
  short:"Focus on human potential and achievements",
  hook:"HUMAN-ism is about humans: what people can do, create, and figure out."},
 {id:"secular",day:2,era:"R",kind:"idea",term:"Secular",
  def:"Worldly or non-religious; relating to life on Earth rather than spiritual matters.",
  short:"Worldly, not religious",
  hook:"A painting of a merchant's family is secular. A painting of an angel is religious."},
 {id:"medici",day:2,era:"R",kind:"person",term:"Medici family",
  def:"A powerful and wealthy family in Florence that supported many Renaissance artists.",
  short:"Rich Florence family that paid artists",
  hook:"Medici = money. They were bankers who acted like sponsors (patrons) for artists."},
 {id:"inquiry",day:2,era:"R",kind:"idea",term:"Inquiry",
  def:"A process of asking questions and searching for the truth through observation and evidence.",
  short:"Asking questions, finding truth with evidence",
  hook:"Inquiry comes from “inquire,” which means to ask. Ask, observe, find evidence."},

 {id:"leonardo",day:3,era:"R",kind:"person",term:"Leonardo da Vinci",
  def:"A famous Renaissance artist, inventor, and scientist known for works like the Mona Lisa.",
  short:"Artist and inventor who painted the Mona Lisa",
  hook:"The ultimate “Renaissance man”: painter, inventor, and scientist all in one. Spelling check: Leonardo da Vinci."},
 {id:"michelangelo",day:3,era:"R",kind:"person",term:"Michelangelo",
  def:"A famous Renaissance sculptor and painter known for the statue of David and painting the Sistine Chapel ceiling.",
  short:"Sculpted David, painted the Sistine Chapel ceiling",
  hook:"Michelangelo = marble and ceiling. David is the statue, the Sistine Chapel is the ceiling."},
 {id:"perspective",day:3,era:"R",kind:"idea",term:"Perspective",
  def:"An art technique that creates the appearance of depth on a flat surface.",
  short:"Art technique that shows depth on a flat surface",
  hook:"Railroad tracks look like they meet far away. Renaissance painters copied that trick."},
 {id:"gutenberg",day:3,era:"R",kind:"person",term:"Gutenberg",
  def:"The inventor of the printing press, which helped spread information quickly.",
  short:"Inventor of the printing press",
  hook:"Person = Gutenberg. Machine = printing press. Don't mix up the inventor and the invention."},
 {id:"press",day:3,era:"R",kind:"idea",term:"Printing press",
  def:"A machine that made it much faster and cheaper to print books and spread ideas.",
  short:"Machine that printed books fast and cheap",
  hook:"The internet of the 1400s. Before it, books were copied by hand. After it, ideas like Luther's spread everywhere."},

 {id:"luther",day:4,era:"F",kind:"person",term:"Martin Luther",
  def:"A German monk who started the Reformation by criticizing the Catholic Church.",
  short:"Monk who started the Reformation",
  hook:"Not Martin Luther King Jr.! This Martin Luther lived 1483–1546, more than 400 years earlier. He wanted people to read the Bible in their own language.",
  ask:"Did he have any kids? Yes. He married Katharina von Bora and they had six children."},
 {id:"theses",day:4,era:"F",kind:"idea",term:"95 Theses",
  def:"A list of powerful arguments written by Martin Luther criticizing the practices and corruption of the Catholic Church.",
  short:"Luther's list of arguments against Church practices",
  hook:"Posted in October 1517. A thesis is an argument, so 95 theses = 95 arguments. A big one: stop selling indulgences."},
 {id:"indulgence",day:4,era:"F",kind:"idea",term:"Indulgence",
  def:"A payment to the Church that people believed would forgive their sins.",
  short:"Payment to the Church to forgive sins",
  hook:"Like trying to buy a “get out of sin free” card. Luther said forgiveness can't be bought."},
 {id:"reformation",day:4,era:"F",kind:"idea",term:"Reformation",
  def:"A movement that led to the creation of new Christian churches separate from the Catholic Church.",
  short:"Movement that created new Christian churches",
  hook:"Re-FORM-ation: people wanted to reform (fix) the Church. It ended up splitting instead."},
 {id:"protestant",day:4,era:"F",kind:"idea",term:"Protestant",
  def:"A follower of any of the Western Christian churches that are separate from the Roman Catholic Church.",
  short:"Christian in a church separate from the Catholic Church",
  hook:"Protest-ant: they protested against the Catholic Church."},
 {id:"worms",day:4,era:"F",kind:"idea",term:"Diet of Worms",
  def:"A meeting in 1521 where Luther was ordered to take back his ideas. He refused, was pushed out of the Church, and had to go into hiding.",
  short:"1521 meeting where Luther refused to back down",
  hook:"No worms were eaten. A “diet” was a formal meeting, and Worms is a city in Germany.",
  ask:"How long was he hiding? About ten months, in Wartburg Castle. He used the time to translate the New Testament into German."},

 {id:"henry",day:5,era:"F",kind:"person",term:"Henry VIII",
  def:"A famous English king who broke away from the Catholic Church to start the Church of England.",
  short:"King who started the Church of England",
  hook:"The pope wouldn't end Henry's marriage, so Henry made his own church and put himself in charge."},
 {id:"calvin",day:5,era:"F",kind:"person",term:"John Calvin",
  def:"An important Reformation leader who established Reformed Christianity and taught predestination.",
  short:"Reformation leader who taught predestination",
  hook:"Like Luther, Calvin taught that people are saved by faith, not actions. What makes Calvin different is predestination.",
  ask:"Why was he forced to leave France? France was Catholic and punished Protestants, so he fled to Geneva, Switzerland."},
 {id:"predestination",day:5,era:"F",kind:"idea",term:"Predestination",
  def:"The belief that God has already decided who will be saved.",
  short:"Belief that God already chose who is saved",
  hook:"PRE-destination: your destination is decided pre (before) you are even born. This is Calvin's signature idea."},
 {id:"huguenots",day:5,era:"F",kind:"person",term:"Huguenots",
  def:"French Protestants who followed Calvin's ideas. They took root in the 1500s, gained political power, fought in religious wars, and many left France for religious freedom.",
  short:"French Protestants who followed Calvin",
  hook:"Huguenots: French, and not Catholic. Many left France to find religious freedom."},
 {id:"map",day:5,era:"F",kind:"idea",auto:false,term:"Map of the Reformation",
  def:"The Reformation split Europe. Lutherans held a lot of land, Catholics still held a lot, and small groups like the Unitarians held very little.",
  short:"Europe split into Catholic and Protestant lands",
  hook:"Big picture: much of northern Europe turned Protestant while much of southern Europe stayed Catholic. Spelling check: Unitarians."},
 {id:"art",day:5,era:"F",kind:"idea",auto:false,term:"Art of the Reformation",
  def:"Many Protestants opposed religious images and discouraged praying to statues. Radical groups destroyed Catholic art, and artists turned to scenes of daily life and civic pride.",
  short:"Daily life and civic pride instead of religious images",
  hook:"Fewer saints and statues, more paintings of regular people, towns, and everyday life.",
  ask:"Why daily life instead of religious scenes? Protestant churches didn't want religious images, so artists painted what people would still buy: everyday life and their proud cities."},

 {id:"scirev",day:6,era:"S",kind:"idea",term:"Scientific Revolution",
  def:"A time of great scientific discovery when people started using experiments and logic to understand the world.",
  short:"Era of experiments and logic",
  hook:"Same spirit as inquiry: don't just trust old books. Test it."},
 {id:"copernicus",day:6,era:"S",kind:"person",term:"Copernicus",
  def:"A scientist who proposed that the sun, not the Earth, is the center of the solar system.",
  short:"Proposed the sun-centered solar system",
  hook:"Copernicus Came first with the idea. Galileo Got the telescope to back it up."},
 {id:"galileo",day:6,era:"S",kind:"person",term:"Galileo",
  def:"A scientist who used a telescope to support ideas about the planets and stars, backing up the heliocentric theory.",
  short:"Used a telescope to support heliocentric theory",
  hook:"Galileo = glass (the telescope lens). Spelling check: Galileo."},
 {id:"heliocentric",day:6,era:"S",kind:"idea",term:"Heliocentric",
  def:"The belief that the sun is the center of our solar system, challenging ancient geocentric (Earth-centered) models and reshaping modern astronomy.",
  short:"Sun-centered model of the solar system",
  hook:"Helio = sun (helium is named after the sun). Geo = Earth (like geography)."},
 {id:"newton",day:6,era:"S",kind:"person",term:"Sir Isaac Newton",
  def:"An English mathematician and physicist who formulated the laws of motion and universal gravitation, transforming our understanding of the cosmos.",
  short:"Laws of motion and gravity",
  hook:"Newton, apple, gravity. He explained why the planets move the way Copernicus and Galileo said they did."}
];
const T = {}; TERMS.forEach(t=>T[t.id]=t);

/* a[0] is always the correct answer */
const HAND = [
 {t:["renaissance"],d:1,q:"The word “Renaissance” means…",a:["Rebirth","Revolution","Religion","Reform"],e:"Renaissance means rebirth: a renewed interest in art and learning."},
 {t:["constantinople"],d:1,q:"Constantinople was the capital of which empire before it was captured?",a:["The Byzantine Empire","The Ottoman Empire","The English Empire","The French Empire"],e:"It was the Byzantine capital until the Ottoman Empire captured it."},
 {t:["ottoman"],d:1,q:"Why did the Ottoman Empire matter so much to European traders?",a:["It controlled trade routes between Europe and Asia","It invented the printing press","It started the Reformation","It paid for Renaissance art"],e:"After capturing Constantinople, the Ottomans controlled key Europe–Asia trade routes."},
 {t:["turning"],d:1,q:"Which of these is the best example of a turning point?",a:["The invention of the printing press","A king eating breakfast","A painter finishing one sketch","A merchant selling cloth on a normal day"],e:"A turning point is a major event that changes the course of history."},
 {t:["humanism"],d:2,q:"A humanist thinker would be MOST interested in…",a:["What humans can achieve and create","Only what happens after death","Buying indulgences","Controlling trade routes"],e:"Humanism focused on human potential and achievements."},
 {t:["secular"],d:2,q:"Which painting subject is secular?",a:["A portrait of a wealthy merchant","An angel visiting Mary","A saint praying","A scene from the Bible"],e:"Secular means worldly or non-religious."},
 {t:["medici"],d:2,q:"How did the Medici family help the Renaissance?",a:["They used their wealth to support artists","They invented perspective","They wrote the 95 Theses","They captured Constantinople"],e:"The Medici were a wealthy Florence family who supported many artists."},
 {t:["inquiry"],d:2,q:"Which is the best example of inquiry?",a:["Asking a question, then observing and gathering evidence","Believing something just because it is old","Memorizing facts without asking questions","Guessing and never checking"],e:"Inquiry is asking questions and searching for truth through observation and evidence."},
 {t:["leonardo"],d:3,q:"Who painted the Mona Lisa?",a:["Leonardo da Vinci","Michelangelo","Galileo","Gutenberg"],e:"Leonardo da Vinci: artist, inventor, and scientist."},
 {t:["michelangelo"],d:3,q:"Who sculpted David and painted the Sistine Chapel ceiling?",a:["Michelangelo","Leonardo da Vinci","Martin Luther","Sir Isaac Newton"],e:"Michelangelo: marble (David) and ceiling (Sistine Chapel)."},
 {t:["perspective"],d:3,q:"An artist makes a road look like it stretches far into the distance on a flat canvas. This technique is…",a:["Perspective","Humanism","Inquiry","Secular"],e:"Perspective creates the appearance of depth on a flat surface."},

/* ---------- storage ---------- */
const KEY = "noah-unit2-v1";
let storageOK = true;
function blank(){ return {terms:{},days:{},last:null}; }
function load(){
  try{
    localStorage.setItem(KEY+"-t","1"); localStorage.removeItem(KEY+"-t");
    const r = localStorage.getItem(KEY);
    if(r){ const o = JSON.parse(r); return Object.assign(blank(), o); }
  }catch(e){ storageOK = false; }
  return blank();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOK = false; } }
function ts(id){ if(!S.terms[id]) S.terms[id] = {box:0,seen:false,right:0,wrong:0}; return S.terms[id]; }
function dayRec(i){ if(!S.days[i]) S.days[i] = {done:{},scores:{}}; return S.days[i]; }

/* ---------- dates ---------- */
const START = new Date(2026,8,21);
function rawIdx(){ const n = new Date(); n.setHours(0,0,0,0); return Math.round((n-START)/864e5); }
function I(){ return Math.max(0, rawIdx()); }
function dateOf(j){ const d = new Date(START); d.setDate(d.getDate()+j); return d; }
function fmt(d,opts){ return d.toLocaleDateString("en-US",opts); }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uniq(a){ return Array.from(new Set(a)); }
function unlocked(i){ return TERMS.filter(t=>t.day<=i+1); }
function unseen(i){ return unlocked(i).filter(t=>!ts(t.id).seen); }
function seenTerms(){ return TERMS.filter(t=>ts(t.id).seen); }
function weight(id){ const s = ts(id); return (4-s.box) + Math.min(3,s.wrong); }
function weightedOrder(ids){
  return uniq(ids).map(id=>({id,k:Math.pow(Math.random(),1/weight(id))})).sort((a,b)=>b.k-a.k).map(o=>o.id);
}
function weakList(){
  return seenTerms().filter(t=>{const s=ts(t.id); return s.wrong>0 && s.box<3;})
    .sort((a,b)=>ts(a.id).box-ts(b.id).box || ts(b.id).wrong-ts(a.id).wrong);
}
function pips(id){ const b = ts(id).box; return '<span class="pips" aria-label="Mastery '+b+' of 3">'+[1,2,3].map(n=>'<i class="'+(b>=n?"on":"")+'"></i>').join("")+'</span>'; }

/* ---------- question building ---------- */
function distractors(t){
  const open = new Set(unlocked(I()).map(x=>x.id));
  return TERMS.filter(o=>o.id!==t.id && o.auto!==false)
    .map(o=>({o,p:(open.has(o.id)?2:0)+(o.kind===t.kind?1:0)+Math.random()*0.9}))
    .sort((a,b)=>b.p-a.p).slice(0,3).map(x=>x.o);
}
function autoQ(t,mode){
  const ds = distractors(t);
  if(mode==="A"){
    const p = t.kind==="person" ? "Who is this?" : t.kind==="place" ? "Which place or empire is this?" : "Which term matches this definition?";
    return {type:"mc",t:[t.id],prompt:p,quote:t.def,opts:shuffle([{text:t.term,ok:true}].concat(ds.map(d=>({text:d.term,ok:false})))),explain:t.term+": "+t.def};
  }
  const p = t.kind==="person" ? "Who was "+t.term+"?" : t.kind==="place" ? "What was "+(t.id==="ottoman"?"the ":"")+t.term+"?" : "What does “"+t.term+"” mean?";
  const p2 = t.id==="medici"||t.id==="huguenots" ? "Who were the "+t.term+"?" : p;
  return {type:"mc",t:[t.id],prompt:p2,opts:shuffle([{text:t.def,ok:true}].concat(ds.map(d=>({text:d.def,ok:false})))),explain:t.hook};
}
function handQ(h){
  return {type:"mc",t:h.t.slice(),prompt:h.q,opts:shuffle(h.a.map((x,k)=>({text:x,ok:k===0}))),explain:h.e};
}
function questionFor(id,used,lastMode){
  const t = T[id], maxD = I()+1;
  const all = HAND.filter(h=>h.t.indexOf(id)>=0 && h.d<=maxD);
  const fresh = all.filter(h=>!used.has(h));
  let modes = t.auto===false ? [] : ["A","B"];
  if(fresh.length) modes.push("H");
  if(!modes.length){ const h = all[Math.floor(Math.random()*all.length)]; return handQ(h); }
  const pick = modes.filter(m=>m!==lastMode[id]);
  const m = (pick.length?pick:modes)[Math.floor(Math.random()*(pick.length?pick:modes).length)];
  lastMode[id] = m;
  if(m==="H"){ const h = fresh[Math.floor(Math.random()*fresh.length)]; used.add(h); return handQ(h); }
  return autoQ(t,m);
}
function matchQ(ids){
  return {type:"match",t:ids.slice(),prompt:"Match each term to its meaning. Pick a term, then pick its match.",defs:shuffle(ids),state:{sel:null,done:{},misses:{},flash:null}};
}
function orderQ(o){
  let sh = shuffle(o.items); let guard = 0;
  while(sh.join("|")===o.items.join("|") && guard++<10) sh = shuffle(o.items);
  return {type:"order",t:[],prompt:o.q,items:o.items,shown:sh,explain:o.e,state:{picked:[]}};
}
function makeQuestions(pool,n,nMatch,used){
  used = used || new Set();
  const lastMode = {}, qs = [];
  const matchable = uniq(pool).filter(id=>T[id].auto!==false);
  const m = matchable.length>=4 ? nMatch : 0;
  let order = weightedOrder(pool), k = 0;
  while(qs.length < n-m){
    if(k>=order.length){ order = weightedOrder(pool); k = 0; }
    qs.push(questionFor(order[k++],used,lastMode));
  }
  for(let j=0;j<m;j++) qs.push(matchQ(shuffle(matchable).slice(0,4)));
  return shuffle(qs);
}
function resetQ(q){
  if(q.type==="mc"){ q.opts = shuffle(q.opts); }
  if(q.type==="match"){ q.defs = shuffle(q.defs); q.state = {sel:null,done:{},misses:{},flash:null}; }
  if(q.type==="order"){ q.shown = shuffle(q.items); q.state = {picked:[]}; }
  delete q.answered; delete q.ok; delete q.picked;
  return q;
}
function record(id,ok){
  const s = ts(id); s.seen = true;
  if(ok){ s.right++; s.box = Math.min(3,s.box+1); }
  else { s.wrong++; if(s.box>=2) s.box = 1; }
}

/* ---------- mission steps ---------- */
function stepsFor(i){
  const rec = dayRec(i), steps = [];
  if(rec.noWarm===undefined){ rec.noWarm = TERMS.filter(t=>t.day<i+1 && ts(t.id).seen).length===0; save(); }
  if(i<=5){
    if(!rec.noWarm) steps.push({id:"warm",name:"Warm-up",d:"5 questions from earlier days"});
    const un = unseen(i);
    steps.push({id:"learn",name:"Learn",d:(rec.done.learn?TERMS.filter(t=>t.day===i+1).length:un.length)+" flashcards"});
    steps.push({id:"quiz",name:"Daily quiz",d:"10 questions"});
    return steps;
  }
  if(unseen(i).length || rec.done.catchup) steps.push({id:"catchup",name:"Catch up",d:(unseen(i).length||"")+" cards you haven't seen yet"});
  if(i===6){
    if(!rec.noWarm) steps.push({id:"warm",name:"Warm-up",d:"5 questions from earlier days"});
    steps.push({id:"big",name:"See how it connects",d:"A short read, no new terms"});
    steps.push({id:"quiz",name:"Connections quiz",d:"10 questions"});
  } else if(i===7){
    steps.push({id:"test",name:"Practice test",d:"25 questions on everything"});
    steps.push({id:"drill",name:"Fix what you missed",d:"10 questions on your weak spots"});
  } else if(i===8){
    steps.push({id:"drill",name:"Weak spots",d:"10 questions on your toughest terms"});
    steps.push({id:"test",name:"Final practice test",d:"25 questions on everything"});
  } else {
    steps.push({id:"warm",name:"Five-minute warm-up",d:"5 quick questions, then go get it"});
  }
  return steps;
}
function checkComplete(i){
  const rec = dayRec(i);
  if(stepsFor(i).every(s=>rec.done[s.id])) rec.complete = true;
  save();
}
function streak(){
  const i = I(); let j = dayRec(i).complete ? i : i-1, n = 0;
  while(j>=0 && S.days[j] && S.days[j].complete){ n++; j--; }
  return n;
}
function drillPool(){
  let ids = weakList().map(t=>t.id);
  const rec = dayRec(I());
  if(rec.missed) ids = uniq(rec.missed.concat(ids));
  if(ids.length<6){
    const rest = seenTerms().filter(t=>ids.indexOf(t.id)<0).sort((a,b)=>ts(a.id).box-ts(b.id).box).map(t=>t.id);
    ids = ids.concat(rest.slice(0,8-ids.length));
  }
  if(ids.length<4) ids = unlocked(I()).map(t=>t.id);
  return ids;
}
function bigTest(){
  const used = new Set();
  const all = TERMS.map(t=>t.id);
  const qs = makeQuestions(all,21,2,used);
  const extra = shuffle(HAND.filter(h=>h.d===7 && !used.has(h))).slice(0,2).map(handQ);
  return shuffle(qs.concat(extra, shuffle(ORDERS).slice(0,2).map(orderQ)));
}

/* ---------- sessions ---------- */
let view = {name:"home"}, sess = null;

function startStep(id){
  const i = I();
  if(id==="learn"||id==="catchup"){
    let list = unseen(i).map(t=>t.id);
    if(!list.length) list = TERMS.filter(t=>t.day===Math.min(i+1,6)).map(t=>t.id);
    startCards(list,id, id==="learn"?DAY_TITLES[i]:"Catch up");
  } else if(id==="big"){ view = {name:"big"}; render(true); }
  else if(id==="warm"){
    const pool = i>=9 ? TERMS.map(t=>t.id) : TERMS.filter(t=>t.day<i+1 && ts(t.id).seen).map(t=>t.id);
    startQuiz(makeQuestions(pool,5,0),"Warm-up","warm");
  } else if(id==="quiz"){
    let qs;
    if(i===6){ qs = shuffle(ORDERS.map(orderQ).concat(shuffle(HAND.filter(h=>h.d===7)).slice(0,7).map(handQ))); }
    else {
      const today = TERMS.filter(t=>t.day===i+1).map(t=>t.id);
      const recent = uniq(today.concat(TERMS.filter(t=>ts(t.id).learnedOn===i).map(t=>t.id)));
      const earlier = TERMS.filter(t=>ts(t.id).seen && recent.indexOf(t.id)<0).map(t=>t.id);
      const used = new Set();
      if(earlier.length>=3) qs = shuffle(makeQuestions(recent,7,1,used).concat(makeQuestions(earlier,3,0,used)));
      else qs = makeQuestions(recent,10,1,used);
    }
    startQuiz(qs, i===6?"Connections quiz":"Daily quiz","quiz");
  } else if(id==="test"){ startQuiz(bigTest(), i===8?"Final practice test":"Practice test","test"); }
  else if(id==="drill"){ startQuiz(makeQuestions(drillPool(),10,1),"Weak spots","drill"); }
}
function startCards(list,stepId,title){
  sess = {kind:"cards",stepId:stepId,title:title,queue:list.slice(),i:0,shown:false,again:{},total:list.length};
  view = {name:"learn"}; render(true);
}
function startQuiz(qs,title,stepId){
  sess = {kind:"quiz",stepId:stepId,title:title,qs:qs,i:0,score:0,missed:[],missedTerms:[]};
  view = {name:"quiz"}; render(true);
}
function finishCards(){
  if(sess.stepId){ dayRec(I()).done[sess.stepId] = true; checkComplete(I()); }
  sess = null; view = {name:"home"}; render(true);
}
function finishQuiz(){
  const i = I();
  if(sess.stepId){
    const rec = dayRec(i);
    rec.done[sess.stepId] = true; rec.scores[sess.stepId] = [sess.score,sess.qs.length];
    if(sess.stepId==="test") rec.missed = uniq(sess.missedTerms);
    S.last = {score:sess.score,total:sess.qs.length,title:sess.title};
    checkComplete(i);
  }
  save(); view = {name:"results"}; render(true);
}
function answered(q,ok,perTerm){
  q.answered = true; q.ok = ok;
  q.t.forEach(id=>{ const good = perTerm ? !perTerm[id] : ok; record(id,good); if(!good) sess.missedTerms.push(id); });
  if(ok) sess.score++; else sess.missed.push(q);
  save();
}

/* ---------- views ---------- */
const $app = document.getElementById("app");

function viewHome(){
  const raw = rawIdx(), i = I(), over = raw>9;
  const st = streak();
  let h = '<section class="panel"><div class="row"><div><h1>'+(over?"Unit 2 is in the books":i===9?"Test day, Noah":"Hey Noah, day "+(i+1)+" of 9")+'</h1><p class="sub">'+
    (over?"The test was Wednesday, Sep 30. Practice is still open if you want it.":i===9?"You've put in the work. One quick warm-up and you're ready.":"Test is Wednesday, Sep 30 · "+(9-i)+" day"+(9-i===1?"":"s")+" to go")+'</p></div>'+
    (st>0?'<span class="badge">'+st+'-day streak</span>':"")+'</div>';
  h += '<div class="cal" aria-label="Study calendar">';
  for(let j=0;j<10;j++){
    const d = dateOf(j); let c = j===9?"test":j>=7?"rev":"";
    let label = j===9?"Test":j>=7?"Review":fmt(d,{weekday:"short"});
    if(j<i || (j===i && S.days[j] && S.days[j].complete)){ if(S.days[j] && S.days[j].complete){ c = "done"; label = "Done"; } else if(j<i){ c += " missed"; label = "Missed"; } }
    if(j===i && !over){ c += " today"; if(label!=="Done") label = "Today"; }
    h += '<div class="'+c+'"><b>'+d.getDate()+'</b>'+label+'</div>';
  }
  h += '</div></section>';

  if(!storageOK) h += '<p class="warn">This browser is blocking saved data, so progress won\'t be remembered after you close the tab. Turning off private browsing usually fixes it.</p>';

  if(!over){
    const rec = dayRec(i), steps = stepsFor(i);
    const extra = i<=5 ? unseen(i).filter(t=>t.day<i+1).length : 0;
    let nextFound = false;
    h += '<section class="panel"><div><p class="sub">Today\'s mission · about '+(i>=9?5:i>=7?20:15)+' minutes</p><h2>'+esc(DAY_TITLES[i])+'</h2></div>';
    if(extra) h += '<p class="sub">Includes '+extra+' card'+(extra===1?"":"s")+' from a day you missed, so you stay on track.</p>';
    h += '<ol class="steps">';
    steps.forEach((s,n)=>{
      const done = !!rec.done[s.id]; let cls = done?"done":(!nextFound?"next":"locked");
      if(!done && !nextFound) nextFound = true;
      const sc = rec.scores[s.id];
      h += '<li class="step '+cls+'"><span class="mark">'+(done?"✓":(n+1))+'</span><div><strong>'+esc(s.name)+'</strong><span class="d">'+(done&&sc?"Score: "+sc[0]+" of "+sc[1]:esc(s.d))+'</span></div>'+
        (cls==="locked"?'<span class="sub">Finish step '+n+' first</span>':'<button class="btn small '+(cls==="next"?"primary":"")+'" data-act="step" data-id="'+s.id+'">'+(done?"Redo":"Start")+'</button>')+'</li>';
    });
    h += '</ol>';
    if(rec.complete) h += '<p><strong>Mission complete.</strong> <span class="sub">'+(i>=9?"Good luck today. You know this.":"Come back tomorrow for "+esc(DAY_TITLES[i+1])+".")+'</span></p>';
    h += '</section>';
  }
  h += '<section class="panel"><h3>Extra practice</h3><p class="sub">Optional. Short rounds that focus on the terms you miss most.</p><div class="btns"><button class="btn" data-act="practice" data-mode="weak">Practice weak spots</button><button class="btn" data-act="practice" data-mode="mixed">Mixed 10 questions</button><button class="btn" data-act="go" data-to="cards">Browse cards</button></div></section>';
  return h;
}

function viewLearn(){
  const id = sess.queue[sess.i], t = T[id];
  let h = '<div class="row"><button class="btn quiet" data-act="quit">← Quit</button><span class="sub">'+esc(sess.title)+' · card '+(Math.min(sess.i,sess.total-1)+1)+' of '+sess.total+(sess.i>=sess.total?" (second look)":"")+'</span></div>';
  h += '<section class="panel flash" data-act="flip" role="button" tabindex="0" aria-label="Flashcard. Press to flip."><span class="era '+t.era+'">'+ERA[t.era]+'</span><div class="term">'+esc(t.term)+'</div>';
  if(sess.shown){
    h += '<p class="def">'+esc(t.def)+'</p><p class="note"><b>Memory hook:</b> '+esc(t.hook)+'</p>';
    if(t.ask) h += '<p class="note ask"><b>You asked:</b> '+esc(t.ask)+'</p>';
  } else h += '<p class="sub">Say the meaning out loud, then tap to check</p>';
  h += '</section>';
  if(sess.shown) h += '<div class="btns" style="justify-content:center"><button class="btn" data-act="card" data-ok="0">Still learning</button><button class="btn primary" id="gotit" data-act="card" data-ok="1">Got it</button></div>';
  return h;
}

function viewBig(){
  const chain = a => '<div class="chain">'+a.map((x,k)=>(k?'<i>→</i>':'')+'<span>'+esc(x)+'</span>').join("")+'</div>';
  return '<div class="row"><button class="btn quiet" data-act="quit">← Back</button><span class="sub">The big picture</span></div>'+
  '<section class="panel"><h2>One idea connects the whole unit</h2><p>In art, in religion, and in science, people stopped simply accepting what they were told and started asking questions. That is humanism and inquiry at work.</p>'+
  chain(["Renaissance (art and learning)","Reformation (religion, 1517)","Scientific Revolution (science)"])+'</section>'+
  '<section class="panel"><h3>A turning point opens the story</h3>'+chain(["Ottomans capture Constantinople","Ottomans control Europe–Asia trade routes","Europe changes course"])+
  '<h3>Money and ideas power the art</h3>'+chain(["Medici wealth","Supports artists like Leonardo and Michelangelo","Art with perspective, humanism, secular subjects"])+
  '<h3>The printing press spreads the protest</h3>'+chain(["Church sells indulgences","Luther posts the 95 Theses","Printing press spreads his ideas","Protestant churches form"])+
  '<p class="sub">Those new churches include Lutherans, Calvin\'s followers (like the Huguenots in France), and Henry VIII\'s Church of England.</p>'+
  '<h3>Science follows the same path</h3>'+chain(["Copernicus: the idea","Galileo: telescope evidence","Newton: the laws that explain it"])+
  '<p class="sub">Heliocentric (sun-centered) replaced geocentric (Earth-centered).</p></section>'+
  '<div class="btns"><button class="btn primary" data-act="bigdone">Got it, take me to the quiz</button></div>';
}

function viewQuiz(){
  const q = sess.qs[sess.i], n = sess.qs.length;
  let h = '<div class="row"><button class="btn quiet" data-act="quit">← Quit</button><span class="sub">'+esc(sess.title)+' · question '+(sess.i+1)+' of '+n+' · score '+sess.score+'</span></div>';
  h += '<div class="bar"><i style="width:'+Math.round(sess.i/n*100)+'%"></i></div><section class="panel"><h2>'+esc(q.prompt)+'</h2>';
  if(q.quote) h += '<p class="quote">'+esc(q.quote)+'</p>';
  if(q.type==="mc"){
    h += '<div class="opts">'+q.opts.map((o,k)=>{
      let c = ""; if(q.answered){ c = " locked"+(o.ok?" good":(q.picked===k?" bad":"")); }
      return '<button class="opt'+c+'" data-act="pick" data-k="'+k+'"><span class="k">'+(k+1)+'</span><span>'+esc(o.text)+'</span></button>';
    }).join("")+'</div>';
  } else if(q.type==="match"){
    const s = q.state;
    h += '<div class="match"><div class="opts">'+q.t.map(id=>'<button class="opt'+(s.done[id]?" good locked":s.sel===id?" sel":"")+'" data-act="mterm" data-id="'+id+'">'+esc(T[id].term)+'</button>').join("")+'</div><div class="opts">'+
      q.defs.map(id=>'<button class="opt'+(s.done[id]?" good locked":s.flash===id?" bad":"")+'" data-act="mdef" data-id="'+id+'">'+esc(T[id].short)+'</button>').join("")+'</div></div>';
    if(!q.answered) h += '<p class="sub">'+(s.sel?"Now pick the meaning of “"+esc(T[s.sel].term)+"”.":"Pick a term on the left first.")+'</p>';
  } else {
    const s = q.state;
    h += '<div class="opts">'+q.shown.map((it,k)=>{
      const pos = s.picked.indexOf(it); let c = pos>=0?" sel":"";
      if(q.answered) c = " locked"+(q.items[pos]===it?" good":" bad");
      return '<button class="opt'+c+'" data-act="ord" data-k="'+k+'"><span class="k">'+(pos>=0?pos+1:"·")+'</span><span>'+esc(it)+'</span></button>';
    }).join("")+'</div>';
    if(!q.answered) h += s.picked.length===q.items.length ? '<div class="btns"><button class="btn primary" data-act="ordcheck">Check my order</button><button class="btn" data-act="ordreset">Start over</button></div>' : '<p class="sub">Tap the events in order, earliest first. Tap one again to undo it.</p>';
  }
  if(q.answered){
    let msg = "";
    if(q.type==="match") msg = q.ok ? "All matched without a miss." : "Matched. Look again at: "+q.t.filter(id=>q.state.misses[id]).map(id=>T[id].term+" ("+T[id].short+")").join("; ")+".";
    else if(q.type==="order") msg = (q.ok?"":"Correct order: "+q.items.join(" → ")+". ")+q.explain;
    else msg = q.explain;
    h += '<div class="fb '+(q.ok?"good":"bad")+'"><b class="'+(q.ok?"good":"bad")+'">'+(q.ok?"Correct.":"Not quite.")+'</b> '+esc(msg)+'</div><div class="btns"><button class="btn primary" id="nextq" data-act="next">'+(sess.i+1<n?"Next question":"See results")+'</button></div>';
  }
  return h+'</section>';
}

function viewResults(){
  const n = sess.qs.length, pct = Math.round(sess.score/n*100);
  const head = pct>=90?"Excellent work":pct>=70?"Solid round":"Good practice. Misses are how you find what to study.";
  let h = '<section class="panel"><p class="sub">'+esc(sess.title)+'</p><h1>'+sess.score+' of '+n+'</h1><p>'+head+'</p>';
  if(sess.missed.length){
    h += '<h3>Worth another look</h3><ol class="miss">'+sess.missed.map(q=>{
      if(q.type==="match") return '<li>Matching<br><span>'+q.t.filter(id=>q.state.misses[id]).map(id=>esc(T[id].term)+": "+esc(T[id].short)).join("<br>")+'</span></li>';
      if(q.type==="order") return '<li>'+esc(q.prompt)+'<br><span>'+esc(q.items.join(" → "))+'</span></li>';
      return '<li>'+esc(q.prompt)+(q.quote?" “"+esc(q.quote)+"”":"")+'<br><span>Answer: '+esc(q.opts.filter(o=>o.ok)[0].text)+'</span></li>';
    }).join("")+'</ol>';
  }
  h += '<div class="btns">'+(sess.missed.length?'<button class="btn" data-act="retry">Retry the ones I missed</button>':"")+'<button class="btn primary" data-act="go" data-to="home">Back to today</button></div></section>';
  return h;
}

function viewCards(){
  const i = I(); let h = '<section class="panel"><h1>All cards</h1><p class="sub">Tap a term to see its meaning and memory hook. New cards open each day.</p></section>';
  for(let d=1;d<=6;d++){
    const list = TERMS.filter(t=>t.day===d), open = d<=i+1;
    h += '<section class="panel'+(open?"":" lockedgrp")+'"><div class="row"><h3>'+esc(DAY_TITLES[d-1])+'</h3><span class="sub">'+(open?list.length+" cards":"Opens "+fmt(dateOf(d-1),{weekday:"short",month:"short",day:"numeric"}))+'</span></div>';
    if(open) h += '<div>'+list.map(t=>'<details><summary><span>'+esc(t.term)+' <span class="era '+t.era+'">'+ERA[t.era]+'</span></span>'+pips(t.id)+'</summary><p>'+esc(t.def)+'</p><p class="hook">'+esc(t.hook)+'</p>'+(t.ask?'<p class="hook"><strong>You asked:</strong> '+esc(t.ask)+'</p>':"")+'</details>').join("")+'</div>';
    h += '</section>';
  }
  return h;
}

function viewProgress(){
  const mastered = TERMS.filter(t=>ts(t.id).box>=3).length;
  const daysDone = [0,1,2,3,4,5,6,7,8].filter(j=>S.days[j] && S.days[j].complete).length;
  let h = '<section class="panel"><h1>Progress</h1><div class="stats"><div class="stat"><b>'+mastered+' of '+TERMS.length+'</b><span>Terms mastered</span></div><div class="stat"><b>'+(S.last?S.last.score+" of "+S.last.total:"–")+'</b><span>'+(S.last?esc(S.last.title):"Last quiz")+'</span></div><div class="stat"><b>'+daysDone+' of 9</b><span>Days completed</span></div></div>';
  ["R","F","S"].forEach(e=>{
    const list = TERMS.filter(t=>t.era===e), sum = list.reduce((a,t)=>a+ts(t.id).box,0), pct = Math.round(sum/(list.length*3)*100);
    h += '<div class="erarow"><span>'+ERA[e]+'</span><div class="bar '+e+'"><i style="width:'+pct+'%"></i></div><em>'+pct+'%</em></div>';
  });
  h += '<p class="sub">A term is mastered after three right answers in a row. A miss sends it back for more practice.</p></section>';
  const weak = weakList().slice(0,8);
  h += '<section class="panel"><h3>Needs more practice</h3>'+(weak.length?'<div class="chips">'+weak.map(t=>'<span class="chip">'+esc(t.term)+'</span>').join("")+'</div>':'<p class="sub">Nothing here yet. Terms you miss on quizzes show up here.</p>')+'<div class="btns"><button class="btn primary" data-act="practice" data-mode="weak">Practice weak spots</button></div></section>';
  const seen = seenTerms();
  if(seen.length) h += '<section class="panel"><h3>Every term so far</h3><div>'+seen.map(t=>'<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><span>'+esc(t.term)+'</span>'+pips(t.id)+'</div>').join("")+'</div></section>';
  h += '<div class="btns"><button class="btn quiet" data-act="reset">'+(view.confirmReset?"Tap again to erase all progress":"Reset progress")+'</button></div>';
  return h;
}

function render(top){
  const v = view.name;
  $app.innerHTML = v==="home"?viewHome():v==="learn"?viewLearn():v==="big"?viewBig():v==="quiz"?viewQuiz():v==="results"?viewResults():v==="cards"?viewCards():viewProgress();
  ["home","cards","progress"].forEach(n=>{ const b = document.getElementById("nav-"+n); if(v===n) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if(top) window.scrollTo(0,0);
  const f = document.getElementById("nextq") || document.getElementById("gotit"); if(f) f.focus();
}

/* ---------- actions ---------- */
const ACT = {
  go(el){ sess = null; view = {name:el.dataset.to}; render(true); },
  quit(){ sess = null; view = {name:"home"}; render(true); },
  step(el){ startStep(el.dataset.id); },
  practice(el){
    let pool = el.dataset.mode==="weak" ? drillPool() : seenTerms().map(t=>t.id);
    if(pool.length<4) pool = unlocked(I()).map(t=>t.id);
    startQuiz(makeQuestions(pool,10,1), el.dataset.mode==="weak"?"Weak spots practice":"Mixed practice", null);
  },
  flip(){ sess.shown = !sess.shown; render(); },
  card(el){
    const id = sess.queue[sess.i], s = ts(id), ok = el.dataset.ok==="1";
    s.seen = true; if(s.learnedOn===undefined) s.learnedOn = I();
    if(ok) s.box = Math.max(s.box,1);
    else if(!sess.again[id]){ sess.again[id] = true; sess.queue.push(id); }
    save(); sess.i++; sess.shown = false;
    if(sess.i>=sess.queue.length) finishCards(); else render(true);
  },
  bigdone(){ dayRec(I()).done.big = true; checkComplete(I()); view = {name:"home"}; render(true); },
  pick(el){
    const q = sess.qs[sess.i]; if(q.answered || q.type!=="mc") return;
    q.picked = +el.dataset.k; answered(q, q.opts[q.picked].ok); render();
  },
  mterm(el){ const q = sess.qs[sess.i]; if(q.answered || q.state.done[el.dataset.id]) return; q.state.sel = el.dataset.id; render(); },
  mdef(el){
    const q = sess.qs[sess.i], s = q.state, id = el.dataset.id; if(q.answered || s.done[id] || !s.sel) return;
    if(id===s.sel){ s.done[id] = true; s.sel = null; if(q.t.every(x=>s.done[x])) answered(q, Object.keys(s.misses).length===0, s.misses); render(); }
    else { s.misses[s.sel] = true; s.flash = id; render(); setTimeout(()=>{ if(s.flash===id){ s.flash = null; if(view.name==="quiz" && sess && sess.qs[sess.i]===q) render(); } },600); }
  },
  ord(el){
    const q = sess.qs[sess.i]; if(q.answered) return;
    const it = q.shown[+el.dataset.k], p = q.state.picked, at = p.indexOf(it);
    if(at>=0) p.splice(at,1); else p.push(it); render();
  },
  ordreset(){ sess.qs[sess.i].state.picked = []; render(); },
  ordcheck(){ const q = sess.qs[sess.i]; answered(q, q.state.picked.join("|")===q.items.join("|")); render(); },
  next(){ sess.i++; if(sess.i>=sess.qs.length) finishQuiz(); else render(true); },
  retry(){ startQuiz(sess.missed.map(resetQ),"Second try",null); },
  reset(){ if(view.confirmReset){ S = blank(); save(); view = {name:"home"}; render(true); } else { view.confirmReset = true; render(); } }
};
document.addEventListener("click",e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const f = ACT[el.dataset.act]; if(f) f(el);
});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const onBtn = document.activeElement && document.activeElement.tagName==="BUTTON";
  if(view.name==="quiz" && sess){
    const q = sess.qs[sess.i];
    if(q.type==="mc" && !q.answered && /^[1-4]$/.test(e.key) && q.opts[+e.key-1]){ q.picked = +e.key-1; answered(q,q.opts[q.picked].ok); render(); }
  } else if(view.name==="learn" && sess){
    if((e.key===" "||e.key==="Enter") && !onBtn){ e.preventDefault(); ACT.flip(); }
  }
});

render();
})();
</script>
